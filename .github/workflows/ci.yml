name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.96.0", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Build all targets
        run: cargo build --all-targets --locked
      - name: Test all targets
        run: cargo test --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  integration:
    name: Bun integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check JavaScript format
        run: bun run fmt:check
      - name: Check JavaScript syntax
        run: bun run build
      - name: Test CLI contracts
        run: bun test --timeout 30000 ./tests/node

  release-integrity:
    name: Release integrity
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify version alignment
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          package_version="$(node -p "require('./package.json').version")"
          source_version="$(sed -n 's/^pub const VERSION: &str = "\([^"]*\)";/\1/p' src/lib.rs)"
          test "$tag_version" = "$cargo_version"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$source_version"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
